<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monitoreo de Sensores - Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .login-card {
            border-radius: 1.25rem;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
        }
        .icon-circle {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
            color: white;
            font-size: 1.8rem;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.25);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none;
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-weight: 600;
            transition: transform 0.15s ease;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #0284c7, #1d4ed8);
        }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card login-card shadow-lg border-0 p-4">
                <div class="card-body">
                    <div class="icon-circle">
                        <i class="bi bi-activity"></i>
                    </div>
                    <h3 class="text-center fw-bold text-dark mb-4">Monitoreo de Sensores</h3>

                    <div th:if="${error}" class="alert alert-danger rounded-3 py-2 small" th:text="${error}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" name="username" class="form-control bg-light border-start-0" placeholder="Ingresa tu usuario" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-primary-custom w-100 text-white">
                            Ingresar al Sistema <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
